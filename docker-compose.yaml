---
version: "3"
services:
  web:
    build:
      context: .
    restart: always
    ports:
      - 10102:80
    environment:
      DB_DSN: ${DB_DSN:-mysql:dbname=${MYSQL_DATABASE:-golly_db};host=db;port=3306}
      DB_USER: ${DB_USER:-${MYSQL_USER:-golly_user}}
      DB_PASS: ${DB_PASS:-${MYSQL_PASSWORD:-golly_pass}}
  db:
    image: mysql:8.4
    # 以前の web (PHP 7.2) は caching_sha2_password で認証できなかったため、mysql_native_password を有効化している。
    # 現在の PHP 8.4 は caching_sha2_password に対応しているが、実環境の DB での接続確認が済むまで互換のため残している。
    command:
      - --mysql-native-password=ON
      - --authentication-policy=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-golly_db}
      MYSQL_USER: ${MYSQL_USER:-golly_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-golly_pass}
    volumes:
      - dbdata:/var/lib/mysql
      # ボリュームが空のとき（初回起動、または down -v の後）だけ、MYSQL_DATABASE に対して流れる。
      - ./ddl.sql:/docker-entrypoint-initdb.d/ddl.sql:ro
volumes:
  dbdata:
    driver: local
